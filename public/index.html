<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GovernIQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Serif+Devanagari:wght@500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Noto+Serif+Tamil:wght@500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#12192B; --indigo:#1E2C4C; --indigo-2:#283B67; --indigo-3:#324879;
    --paper:#EEEBE3; --paper-2:#E4E0D5; --card:#FBFAF7; --line:#D9D4C6;
    --brass:#A17A2E; --brass-2:#C79A44;
    --brick:#9C3B2C; --brick-tint:#F3E2DD;
    --teal:#2C6456; --teal-tint:#DEE9E3;
    --amber:#8C6A1F; --amber-tint:#F1E7D0;
    --slate:#5B6274; --slate-dark:#2A3145;
    --shadow-card:0 1px 2px rgba(18,25,43,.04), 0 2px 10px rgba(18,25,43,.05);
    --shadow-card-hover:0 2px 4px rgba(18,25,43,.06), 0 6px 18px rgba(18,25,43,.08);
  }
  *{box-sizing:border-box;}
  html[lang="hi"] body{font-family:'Noto Sans Devanagari','IBM Plex Sans',sans-serif;}
  html[lang="hi"] .serif{font-family:'Noto Serif Devanagari','Fraunces',serif;}
  html[lang="bn"] body{font-family:'Noto Sans Bengali','IBM Plex Sans',sans-serif;}
  html[lang="bn"] .serif{font-family:'Noto Serif Bengali','Fraunces',serif;}
  html[lang="ta"] body{font-family:'Noto Sans Tamil','IBM Plex Sans',sans-serif;}
  html[lang="ta"] .serif{font-family:'Noto Serif Tamil','Fraunces',serif;}
  html[lang="ar"] body{font-family:'Noto Sans Arabic','IBM Plex Sans',sans-serif;}
  html[lang="ar"] .serif{font-family:'Noto Naskh Arabic','Fraunces',serif;}
  /* RTL: mirror the two fixed edges (sidebar offset, text alignment) for
     Arabic. This does not mirror the whole layout (icon order, etc.) —
     that's a larger visual-design exercise; this covers what's needed for
     the language to actually be readable and usable right-to-left. */
  html[dir="rtl"] body{direction:rtl;}
  html[dir="rtl"] .askbar-wrap,html[dir="rtl"] .ask-answer{left:0;right:64px;}
  @media (max-width:860px){ html[dir="rtl"] .askbar-wrap,html[dir="rtl"] .ask-answer{right:0;} }
  html[dir="rtl"] .field-row{grid-template-columns:1fr 132px;}
  html[dir="rtl"] .card{border-left:none;border-right:3px solid var(--line);}
  html[dir="rtl"] .card.st-draft{border-right-color:var(--slate);}
  html[dir="rtl"] .card.st-pending{border-right-color:var(--amber);}
  html[dir="rtl"] .card.st-new,html[dir="rtl"] .card.st-assigned{border-right-color:var(--indigo-3);}
  html[dir="rtl"] .card.st-progress{border-right-color:var(--teal);}
  html[dir="rtl"] .card.st-closed{border-right-color:#7C8A73;}
  html[dir="rtl"] .card.st-critical{border-right-color:var(--brick);}
  html[dir="rtl"] .stat{border-left:none;border-right:3px solid var(--indigo-3);}
  html[dir="rtl"] .stat.crit{border-right-color:var(--brick);}
  html[dir="rtl"] .stat.amber{border-right-color:var(--amber);}
  html[dir="rtl"] .stat.teal{border-right-color:var(--teal);}
  body{margin:0;background:var(--paper);color:var(--slate-dark);font-family:'IBM Plex Sans','Noto Sans Devanagari',sans-serif;-webkit-font-smoothing:antialiased;}
  .serif{font-family:'Fraunces','Noto Serif Devanagari',serif;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  /* ---- LOGIN ---- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--indigo);padding:20px;}
  .login-box{background:var(--card);border-radius:14px;padding:30px 26px;max-width:360px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .login-box h1{font-family:'Fraunces','Noto Serif Devanagari',serif;font-size:23px;margin:0 0 4px;font-weight:600;}
  .login-box p{font-size:13.5px;color:var(--slate);margin:0 0 18px;line-height:1.5;}
  .login-box label{font-size:11.5px;color:var(--slate);display:block;margin-bottom:4px;}
  .login-box select,.login-box input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;margin-bottom:14px;font-size:14px;}
  .login-box button{width:100%;background:var(--indigo);color:#fff;border:none;padding:11px;border-radius:7px;font-weight:600;font-size:14px;}
  .login-note{font-size:11.5px;color:var(--slate);margin-top:12px;line-height:1.55;padding-top:12px;border-top:1px solid var(--line);}
  .footer-credit{font-size:10.5px;color:var(--slate);text-align:center;margin-top:16px;opacity:.65;letter-spacing:.02em;}

  /* ---- APP SHELL ---- */
  .topbar{background:linear-gradient(155deg,var(--indigo) 0%,var(--indigo-3) 100%);color:#fff;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(199,154,68,.35);}
  .topbar .who{font-size:12.5px;color:#B7BFDA;}
  .topbar .who b{color:#fff;font-weight:600;}
  .topbar .who .role{color:#9BA4C4;}
  .topbar-actions{display:flex;align-items:center;gap:8px;}
  .lang-select{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;padding:6px 9px;border-radius:6px;font-size:12px;appearance:none;-webkit-appearance:none;}
  .lang-select option{color:var(--slate-dark);}
  .topbar button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;padding:6px 11px;border-radius:6px;font-size:12px;}
  .app-body{display:flex;}
  .sidebar{width:64px;flex-shrink:0;background:var(--indigo);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:6px;}
  .sidebar .mark{width:32px;height:32px;border-radius:8px;overflow:hidden;margin-bottom:14px;}
  .sidebar .mark img{width:100%;height:100%;object-fit:cover;display:block;}
  .navicon{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#8E99BC;cursor:pointer;transition:background .15s,color .15s;}
  .navicon svg{width:18px;height:18px;}
  .navicon.active{background:var(--indigo-2);color:var(--brass-2);}
  .navicon:hover{background:var(--indigo-2);color:#fff;}
  .mobile-tabs{display:none;background:var(--indigo-2);overflow-x:auto;}
  .mobile-tab{flex-shrink:0;text-align:center;padding:10px 16px;font-size:12.5px;color:#AEB6D2;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;}
  .mobile-tab.active{color:#fff;border-bottom-color:var(--brass-2);font-weight:600;}
  @media (max-width:860px){ .sidebar{display:none;} .mobile-tabs{display:flex;} }
  .page-title{font-family:'Fraunces','Noto Serif Devanagari',serif;font-size:20px;font-weight:600;margin:2px 0 14px;color:var(--ink);}

  .main{flex:1;min-width:0;max-width:900px;padding:18px 24px;padding-bottom:44px;}
  @media (max-width:640px){ .main{padding:16px;} }
  .page-title{font-family:'Fraunces','Noto Serif Devanagari',serif;font-size:23px;font-weight:600;letter-spacing:-.01em;margin:2px 0 16px;}
  .section-title{font-family:'Fraunces','Noto Serif Devanagari',serif;font-size:16px;font-weight:600;margin:22px 0 10px;color:var(--ink);}
  .section-title:first-child{margin-top:0;}

  .strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .stat{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--indigo-3);border-radius:9px;padding:10px 11px;box-shadow:var(--shadow-card);}
  .stat b{font-family:'Fraunces','Noto Serif Devanagari',serif;font-size:21px;line-height:1;display:block;color:var(--slate-dark);margin-bottom:3px;}
  .stat.crit{border-left-color:var(--brick);}
  .stat.crit b{color:var(--brick);}
  .stat.amber{border-left-color:var(--amber);}
  .stat.teal{border-left-color:var(--teal);}
  .stat span{font-size:11px;color:var(--slate);line-height:1.3;display:block;}
  @media (max-width:420px){ .strip{grid-template-columns:repeat(2,1fr);} }

  .card{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow-card);transition:box-shadow .15s,transform .15s;}
  .card:hover{box-shadow:var(--shadow-card-hover);transform:translateY(-1px);}
  .card.st-draft{border-left-color:var(--slate);}
  .card.st-pending{border-left-color:var(--amber);}
  .card.st-new,.card.st-assigned{border-left-color:var(--indigo-3);}
  .card.st-progress{border-left-color:var(--teal);}
  .card.st-closed{border-left-color:#7C8A73;}
  .card.st-critical{border-left-color:var(--brick);}

  .my-day-grid{display:grid;grid-template-columns:1fr 300px;gap:20px;}
  @media (max-width:760px){ .my-day-grid{grid-template-columns:1fr;} }
  .pulse-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);}
  .pulse-item:last-child{border-bottom:none;}
  .pulse-name{font-size:13px;color:var(--slate-dark);font-weight:500;}
  .pulse-bar{flex:1;height:5px;background:var(--paper-2);border-radius:3px;margin:0 10px;overflow:hidden;}
  .pulse-fill{height:100%;background:var(--brass);}
  .pulse-fill.high{background:var(--brick);}
  .pulse-fill.low{background:var(--teal);}
  .pulse-val{font-size:11.5px;color:var(--slate);white-space:nowrap;}
  .changed-item{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:#3E4457;padding:7px 0;border-bottom:1px solid var(--line);line-height:1.4;}
  .changed-item:last-child{border-bottom:none;}
  .changed-dot{width:6px;height:6px;border-radius:50%;margin-top:5px;flex-shrink:0;}
  .changed-dot.new{background:var(--brick);}
  .changed-dot.res{background:var(--teal);}
  .changed-dot.upd{background:var(--brass);}
  .card-title{font-family:'Fraunces','Noto Serif Devanagari',serif;font-size:15.5px;font-weight:500;margin:2px 0 4px;color:var(--ink);}
  .card-meta{font-size:12px;color:var(--slate);}
  .card .why{font-size:12.5px;color:#3E4457;margin-top:7px;padding-top:7px;border-top:1px solid var(--line);}
  .tag{font-size:10px;font-weight:600;padding:3px 7px;border-radius:5px;white-space:nowrap;letter-spacing:.02em;}
  .tag.draft{background:#EAE7DD;color:var(--slate);}
  .tag.pending{background:var(--amber-tint);color:var(--amber);}
  .tag.new,.tag.assigned{background:#E3E7F0;color:var(--indigo-2);}
  .tag.progress{background:var(--teal-tint);color:var(--teal);}
  .tag.closed{background:#E1E5DC;color:#4A5A44;}
  .tag.critical{background:var(--brick-tint);color:var(--brick);}

  .btn{font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--slate-dark);transition:border-color .15s;}
  .btn.primary{background:var(--indigo);border-color:var(--indigo);color:#fff;}
  .btn.danger{background:var(--brick);border-color:var(--brick);color:#fff;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}

  .field-row{margin-bottom:11px;font-size:13.5px;display:grid;grid-template-columns:132px 1fr;gap:10px;align-items:baseline;}
  .field-row .lbl{font-size:11.5px;color:var(--slate);display:block;}
  @media (max-width:480px){ .field-row{grid-template-columns:1fr;gap:2px;} }
  .redacted{font-style:italic;color:var(--slate);background:var(--paper-2);padding:1px 6px;border-radius:4px;font-size:12px;}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:15px 16px;margin-bottom:14px;box-shadow:var(--shadow-card);}
  input.f,textarea.f,select.f{width:100%;border:1px solid var(--line);border-radius:7px;padding:9px 10px;font-size:13.5px;background:var(--paper);margin-bottom:8px;}
  textarea.f{min-height:60px;}
  label.field-row.lbl{font-size:11.5px;color:var(--slate);display:block;margin-bottom:4px;}

  .ai-box{background:var(--paper-2);border-radius:8px;padding:12px;margin-top:10px;}
  .ai-badge{font-size:10px;font-weight:600;background:#E3E7F0;color:var(--indigo-2);padding:2px 7px;border-radius:5px;display:inline-block;margin-bottom:8px;letter-spacing:.02em;}
  .ai-badge.scrutiny{background:var(--amber-tint);color:var(--amber);}
  .ai-row{font-size:12.5px;margin-bottom:5px;}
  .ai-row .lbl{font-size:10.5px;color:var(--slate);}
  .ans-row{margin-bottom:10px;}
  .ans-row:last-child{margin-bottom:0;}
  .ans-row .lbl{font-size:10.5px;color:var(--slate);display:block;margin-bottom:2px;}
  .ans-row .val{font-size:13.5px;color:var(--slate-dark);line-height:1.5;}
  .ans-row.answer .val{font-family:'Fraunces','Noto Serif Devanagari',serif;font-size:16px;font-weight:500;}
  .conf-badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;}
  .conf-High{background:var(--teal-tint);color:var(--teal);}
  .conf-Medium{background:var(--amber-tint);color:var(--amber);}
  .conf-Low{background:var(--brick-tint);color:var(--brick);}

  .audit-item{font-size:12px;color:var(--slate);padding:7px 0;border-bottom:1px solid var(--line);}
  .audit-item:last-child{border-bottom:none;}
  .audit-item b{color:var(--slate-dark);}
  .task-item,.evid-item{font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;}
  .task-item:last-child,.evid-item:last-child{border-bottom:none;}

  .back-link{font-size:12.5px;color:var(--indigo);cursor:pointer;margin-bottom:12px;display:inline-block;}
  .spinner{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--brass);animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .empty{font-size:13px;color:var(--slate);padding:16px 0;}

  .askbar-wrap{position:fixed;left:64px;right:0;bottom:0;background:linear-gradient(155deg,var(--indigo) 0%,var(--indigo-3) 100%);padding:10px 16px;}
  @media (max-width:860px){ .askbar-wrap{left:0;} }
  .askbar{max-width:688px;margin:0 auto;display:flex;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:5px 5px 5px 12px;}
  .askbar input{flex:1;background:none;border:none;color:#fff;font-size:13.5px;}
  .askbar input::placeholder{color:#9BA4C4;}
  .askbar input:focus{outline:none;}
  .askbar button{background:var(--brass);color:var(--indigo);border:none;font-weight:700;font-size:12.5px;padding:8px 14px;border-radius:7px;}
  .ask-answer{position:fixed;left:64px;right:0;bottom:60px;display:flex;justify-content:center;padding:0 16px;z-index:5;}
  @media (max-width:860px){ .ask-answer{left:0;} }
  .ask-answer-inner{max-width:688px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px 10px 0 0;padding:14px 16px;box-shadow:0 -6px 20px rgba(18,25,43,.12);max-height:38vh;overflow-y:auto;}

  :focus-visible{outline:2px solid var(--brass-2);outline-offset:1px;}
  @media (prefers-reduced-motion:reduce){ .card,.tab,.btn{transition:none;} }
</style>
</head>
<body>

<div id="root"></div>

<script>
"use strict";
// =====================================================================
// CORE APPLICATION LOGIC — this exact code was written as app-logic.js,
// tested independently with Node's built-in test runner (16/16 passing,
// including deliberately-broken-then-restored verification), THEN pasted
// here unmodified. This is what "written to be lifted into a real
// backend" means concretely: nothing below was written for the browser
// specifically. Moving it to a server changes WHERE it runs, not WHAT it does.
// =====================================================================
// =====================================================================
// LANGUAGE — a small, self-contained i18n layer. Only UI chrome (labels,
// buttons, messages, role/status names) is translated; citizen-entered
// case data (title, description, location, name) is never translated —
// it's the actual record, not interface text. Adding a third language
// later means adding one more key to ROLE_LABELS / STATUS_LABELS / UI
// below — nothing else in this file needs to change.
// =====================================================================
const ROLE_LABELS = {

    CONSTITUENCY_TEAM: "নির্বাচনী এলাকা দল", FIELD_TEAM: "ফিল্ড টিম", RESEARCH_TEAM: "নীতি ও গবেষণা",

    REPRESENTATIVE_SARPANCH: "சர்பஞ்ச் / பஞ்சாயத்து தலைவர்", REPRESENTATIVE_OTHER: "பிரதிநிதி (மற்றவை)",
    CHIEF_OF_STAFF: "தனிச் செயலாளர்", OFFICE_ADMIN: "அலுவலக மேற்பார்வையாளர்",
    CONSTITUENCY_TEAM: "தொகுதி குழு", FIELD_TEAM: "களக் குழு", RESEARCH_TEAM: "கொள்கை & ஆய்வு",
  },

    REPRESENTATIVE_MP: "Diputado Nacional", REPRESENTATIVE_MLA: "Diputado Estatal", REPRESENTATIVE_MAYOR: "Alcalde / Concejal",
    REPRESENTATIVE_SARPANCH: "Sarpanch / Jefe de Panchayat", REPRESENTATIVE_OTHER: "Representante (Otro)",
    CHIEF_OF_STAFF: "Secretario Privado", OFFICE_ADMIN: "Superintendente de Oficina",
    CONSTITUENCY_TEAM: "Equipo del Distrito", FIELD_TEAM: "Equipo de Campo", RESEARCH_TEAM: "Política e Investigación",
  },
  fr: {
    REPRESENTATIVE_MP: "Député national", REPRESENTATIVE_MLA: "Député d'État", REPRESENTATIVE_MAYOR: "Maire / Conseiller",
    REPRESENTATIVE_SARPANCH: "Sarpanch / Chef de Panchayat", REPRESENTATIVE_OTHER: "Représentant (Autre)",
    CHIEF_OF_STAFF: "Secrétaire particulier", OFFICE_ADMIN: "Superviseur de bureau",
    CONSTITUENCY_TEAM: "Équipe de circonscription", FIELD_TEAM: "Équipe de terrain", RESEARCH_TEAM: "Politique et recherche",
  },
  ar: {

// Mirrors ASSIGNABLE_STATUSES in functions/api/grievances/[id].js — a case
// can be (re)assigned any time it's open, not just once out of NEW. Keep
// these two lists in sync; the server is still the real gate, this only
// controls whether the Assign panel renders.
const ASSIGNABLE_STATUSES = ["NEW", "ASSIGNED", "IN_PROGRESS", "WAITING_ON_DEPARTMENT", "ESCALATED", "REOPENED"];

// Soft department match between an assignable user's `department` (from
// the users table) and a case's AI-suggested responsibleAuthority — used
// only to sort the assignee dropdown and star likely matches, never to
// hide anyone. Both sides are free text with no shared vocabulary (the AI
// generates authority names on the fly), so this is a loose case-
// insensitive substring check in either direction rather than an exact
// match, which would rarely fire.
function departmentMatchesAuthority(department, authority) {
  if (!department || !authority) return false;
  const d = department.trim().toLowerCase();
  const a = authority.trim().toLowerCase();
  if (!d || !a) return false;
  return a.includes(d) || d.includes(a);
}

// Returns a copy of `users` sorted so department matches for the given
// case come first (alphabetically within each group), without removing or
// hiding any user — the assignee dropdown should never be a hard filter,
// since incomplete department data or an unusual case shouldn't block
// assigning the right person.
function sortAssigneesForCase(userList, responsibleAuthority) {
  return [...userList].sort((a, b) => {
    const aMatch = departmentMatchesAuthority(a.department, responsibleAuthority) ? 0 : 1;
    const bMatch = departmentMatchesAuthority(b.department, responsibleAuthority) ? 0 : 1;
    if (aMatch !== bMatch) return aMatch - bMatch;
    return (a.name || "").localeCompare(b.name || "");
  });
}

    body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 500, system, messages: [{ role: "user", content: user }] })

  const text = (data.content || []).map(b => b.text || "").join("");

function applyServerGrievance(g, data) {
  // Maps a server response (list row shape, snake_case) onto the local
  // grievance object (camelCase) — used both when opening a case and after
  // every workflow action, so the UI always reflects what's actually in D1.
  g.status = data.status;
  g.title = data.title || g.title;
  g.description = data.description || g.description;
  g.locationText = data.location_text != null ? data.location_text : g.locationText;
  g.category = data.category;
  g.priority = data.priority;
  g.responsibleAuthority = data.responsible_authority;
  g.assignedTo = data.assigned_to;
  g.displayId = data.display_id;
  g.citizenName = data.citizen_name;
  g.citizenContact = data.citizen_contact;
  g.audit = data.audit || g.audit;
  g.tasks = data.tasks || g.tasks || [];
  g.evidence = data.evidence || g.evidence || [];
  if (data.ai_suggestion) {
    const suggestion = typeof data.ai_suggestion === "string" ? JSON.parse(data.ai_suggestion) : data.ai_suggestion;
    const knownAuthorities = ["PHED", "PWD", "Municipal", "Electricity Department", "Health Department"];
    const requiresExtraScrutiny = !knownAuthorities.some(k => (suggestion.authority || "").toLowerCase().includes(k.toLowerCase()));
    g.aiSuggestion = { ...suggestion, priority: (suggestion.severity || "").toUpperCase(), requiresExtraScrutiny };
  }
}

      locationText: r.location_text,

      category: r.category,
      priority: r.priority,
      responsibleAuthority: r.responsible_authority,
      assignedTo: r.assigned_to,
      createdAt: r.created_at,
      aiSuggestion: null,       // populated when a case is opened (detail fetch), not in the list
      tasks: r.tasks || [], evidence: [],  // evidence populated on detail fetch; tasks come with the list for the My Day overdue count
      audit: [{ action: "CREATED", actor: "database", at: r.created_at, detail: "Loaded from D1" }],

}

function tagClass(status) {
  if (status === "DRAFT") return "draft";
  if (status === "PENDING_REVIEW" || status === "REVIEW_REQUIRED") return "pending";
  if (status === "NEW") return "new";
  if (status === "ASSIGNED") return "assigned";
  if (status === "IN_PROGRESS" || status === "WAITING_ON_DEPARTMENT" || status === "ESCALATED" || status === "RESOLVED") return "progress";
  if (status === "VERIFIED" || status === "CLOSED") return "closed";
  return "";
}

function daysBetween(dateStr) {
  if (!dateStr) return null;
  const target = new Date(dateStr + "T00:00:00");
  const now = new Date(); now.setHours(0, 0, 0, 0);
  return Math.round((target - now) / 86400000);
}
function ageDays(dateTimeStr) {
  if (!dateTimeStr) return null;
  const created = new Date(dateTimeStr.replace(" ", "T") + "Z");
  if (isNaN(created.getTime())) return null;
  return Math.floor((Date.now() - created.getTime()) / 86400000);
}
function dueText(d) {
  if (d < 0) return `${t("overdue")} <bdi>${Math.abs(d)}</bdi> ${t("days")}`;
  if (d === 0) return t("dueToday");
  return `${t("dueIn")} <bdi>${d}</bdi> ${t("days")}`;
}

// Everything below is computed directly from real fields already in D1 —
// priority, status, due_date, sanctioned_date, timestamps. None of this is
// AI-generated text; the one place real AI output exists (classify.js's
// suggestion) keeps its own "AI INFERENCE" badge in the case detail view,
// unchanged. This dashboard never manufactures reasoning that wasn't
// actually computed.
function buildIntelligenceItems() {
  const items = [];

  grievances.forEach(g => {
    if (g.status === "CLOSED" || g.status === "DRAFT") return;
    if (g.status === "PENDING_REVIEW") {
      items.push({ tagLabel: t("tagTodo"), tagClass: "new", title: g.title, meta: g.displayId || t("notYetOfficial"),
        why: t("aiReadyReview"), action: t("actionReviewClassification"), rank: 3 });
      return;
    }
    if (g.priority === "CRITICAL" || g.priority === "HIGH") {
      const age = ageDays(g.createdAt);
      items.push({ tagLabel: t("tagUrgent"), tagClass: "critical", title: g.title, meta: g.displayId,
        why: `${prettyStatus(g.priority)} ${t("priority")}${age != null ? " · " + t("openFor") + " <bdi>" + age + "</bdi> " + t("days") : ""}`,
        action: t("actionFollowUpDept"), rank: g.priority === "CRITICAL" ? 1 : 2 });
    }
  });

  projects.forEach(p => {
    if (p.status === "AT_RISK" || p.status === "DELAYED") {
      items.push({ tagLabel: t("tagWatch"), tagClass: "pending", title: p.title, meta: p.department || "",
        why: `${prettyStatus(p.status)}${p.sanctioned_date ? " · " + t("sanctioned") + " <bdi>" + p.sanctioned_date + "</bdi>" : ""}`,
        action: t("actionRequestUpdate"), rank: p.status === "AT_RISK" ? 2 : 3 });
    }
  });

  commitments.forEach(c => {
    if (c.status === "DONE") return;
    const d = daysBetween(c.due_date);
    if (d !== null && d <= 3) {
      items.push({ tagLabel: d < 0 ? t("tagUrgent") : t("tagTodo"), tagClass: d < 0 ? "critical" : "new",
        title: c.title, meta: "", why: dueText(d), action: t("actionSendFollowUp"), rank: d < 0 ? 1 : 2 });
    }
  });

  documents.forEach(doc => {
    const age = ageDays(doc.created_at);
    if (age !== null && age <= 7) {
      items.push({ tagLabel: t("tagFollowup"), tagClass: "progress", title: doc.title, meta: doc.source_department || "",
        why: doc.summary || t("recentlyLogged"), action: t("actionReviewDocument"), rank: 4 });
    }
  });

  items.sort((a, b) => a.rank - b.rank);
  return items.slice(0, 6);
}

function renderPulse() {
  const buckets = {};
  grievances.forEach(g => {
    if (!g.category) return;
    if (!buckets[g.category]) buckets[g.category] = 0;
    if (!["CLOSED", "VERIFIED"].includes(g.status)) buckets[g.category]++;
  });
  const cats = Object.keys(buckets);
  if (cats.length === 0) return `<div class="empty">${t("noCategorizedCasesYet")}</div>`;
  const maxOpen = Math.max(...cats.map(c => buckets[c]), 1);
  return cats.map(c => {
    const pct = Math.round((buckets[c] / maxOpen) * 100);
    const fillClass = buckets[c] >= maxOpen ? "high" : buckets[c] === 0 ? "low" : "";
    return `<div class="pulse-item"><span class="pulse-name"><bdi>${c}</bdi></span><div class="pulse-bar"><div class="pulse-fill ${fillClass}" style="width:${pct}%"></div></div><span class="pulse-val">${buckets[c]} ${t("open")}</span></div>`;
  }).join("");
}

function activityDotClass(action) {
  if (["CREATED", "LOGGED"].includes(action)) return "new";
  if (["CLOSED", "COMPLETED", "VERIFIED"].includes(action)) return "res";
  return "upd";
}
function renderWhatChanged() {
  if (activity.length === 0) return `<div class="empty">${t("noRecentActivity")}</div>`;
  return activity.slice(0, 6).map(a =>
    `<div class="changed-item"><span class="changed-dot ${activityDotClass(a.action)}"></span><bdi>${a.entity_title || a.detail || a.action}</bdi></div>`
  ).join("");
}

function renderCommitmentsDueSoon() {
  const upcoming = commitments.filter(c => c.status !== "DONE" && c.due_date)
    .sort((a, b) => a.due_date.localeCompare(b.due_date)).slice(0, 5);
  if (upcoming.length === 0) return `<div class="empty">${t("noCommitmentsDueSoon")}</div>`;
  return upcoming.map(c => {
    const d = daysBetween(c.due_date);
    return `<div class="changed-item"><span class="changed-dot ${d < 0 ? "new" : "upd"}"></span><bdi>${c.title} — ${dueText(d)}</bdi></div>`;
  }).join("");
}

function attachAppHandlers() {
  document.getElementById("logoutBtn").addEventListener("click", () => {
    // Real sign-out now happens at Cloudflare Access, not in this page's
    // memory — clearing local `session` alone would leave the Access
    // cookie valid and just reload back into the same identity.
    window.location.href = `https://${ACCESS_TEAM_DOMAIN}/cdn-cgi/access/logout`;
  });
  const langSelect = document.getElementById("langSelect");
  if (langSelect) langSelect.addEventListener("change", (e) => {
    currentLang = e.target.value;
    if (typeof localStorage !== "undefined") localStorage.setItem("governiq_lang", currentLang);
    applyDocumentLanguage(currentLang);
    render();
  });
  document.querySelectorAll("[data-nav]").forEach(navEl => navEl.addEventListener("click", () => { currentView = navEl.dataset.nav; render(); }));
  document.querySelectorAll("[data-open]").forEach(c => c.addEventListener("click", async () => {
    currentCaseId = c.dataset.open; currentView = "DETAIL"; render();
    // Fetch the real, current state (including the actual audit trail) from
    // D1 rather than trusting whatever this browser tab happened to have in
    // memory — another user or session may have changed this case since.
    try {
      const res = await fetch(`/api/grievances/${currentCaseId}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      const g = grievances.find(x => x.id === currentCaseId);
      if (g) { applyServerGrievance(g, data); render(); }
    } catch (e) {
      // Keep showing whatever was cached locally; detail view still usable.
    }
  }));

  const backLink = document.getElementById("backToList");
  if (backLink) backLink.addEventListener("click", () => { currentView = "LIST"; render(); });

  const newBtn = document.getElementById("newCaseBtn");
  if (newBtn) newBtn.addEventListener("click", () => { currentView = "NEW"; render(); });

  const saveGDetailBtn = document.getElementById("saveGDetailBtn");
  if (saveGDetailBtn) saveGDetailBtn.addEventListener("click", async () => {
    const g = grievances.find(x => x.id === saveGDetailBtn.dataset.id);
    if (!g) return;
    const title = document.getElementById("gdTitle").value.trim();
    const description = document.getElementById("gdDesc").value.trim();
    if (!title || !description) { alert(t("couldNotSave")); return; }
    const payload = {
      action: "EDIT", title, description,
      locationText: document.getElementById("gdLoc").value,
    };
    // Citizen name/contact inputs only exist in the DOM for roles with
    // Sensitive Data Access — the server independently re-checks this
    // permission regardless of what this payload contains.
    const nameEl = document.getElementById("gdCitizenName");
    const contactEl = document.getElementById("gdCitizenContact");
    if (nameEl) payload.citizenName = nameEl.value;
    if (contactEl) payload.citizenContact = contactEl.value;

    saveGDetailBtn.disabled = true;
    saveGDetailBtn.textContent = t("saving");
    try {
      const res = await fetch(`/api/grievances/${g.id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      applyServerGrievance(g, data);
      render();
    } catch (e) {
      saveGDetailBtn.disabled = false;
      saveGDetailBtn.textContent = t("save");
      alert(t("couldNotSave"));
    }
  });

  const classifyNewBtn = document.getElementById("classifyNewBtn");
  if (classifyNewBtn) classifyNewBtn.addEventListener("click", async () => {
    const citizenName = document.getElementById("fName").value.trim();
    const citizenContact = document.getElementById("fContact").value.trim();
    const description = document.getElementById("fDesc").value.trim();
    const resultEl = document.getElementById("classifyNewResult");
    if (!citizenName || !citizenContact || !description) {
      resultEl.innerHTML = `<div style="color:var(--brick);margin-top:8px;">${t("couldNotSave")}</div>`;
      return;
    }
    classifyNewBtn.disabled = true;
    classifyNewBtn.textContent = t("saving");
    resultEl.innerHTML = "";
    try {
      // Step 1: create the DRAFT record — title is left for the AI to fill
      // in a moment later, per the new single-box intake design.
      const createRes = await fetch("/api/grievances", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ description, citizenName, citizenContact }),
      });
      const created = await createRes.json();
      if (created.error) throw new Error(created.error);

      const g = {
        id: created.id, displayId: null, status: "DRAFT",
        title: created.title, description, locationText: null,
        citizenName, citizenContact,
        category: null, priority: null, responsibleAuthority: null,
        aiSuggestion: null, assignedTo: null, tasks: [], evidence: [],
        audit: [],
      };
      addAudit(g, "CREATED", "Draft saved by field intake — persisted to database");
      grievances.unshift(g);

      // Step 2: classify immediately — same server-side redaction and AI
      // call the old two-step flow always used, just chained automatically
      // instead of waiting for a second button press.
      classifyNewBtn.textContent = t("thinking");
      const classifyRes = await fetch("/api/classify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: g.id, description, citizenName, citizenContact }),
      });
      const out = await classifyRes.json();
      if (out.error) throw new Error(out.error);
      applyServerGrievance(g, out);

      currentCaseId = g.id; currentView = "DETAIL"; render();
    } catch (e) {
      classifyNewBtn.disabled = false;
      classifyNewBtn.textContent = t("classifyBtn");
      resultEl.innerHTML = `<div style="color:var(--brick);margin-top:8px;">${t("couldNotClassify")}</div>`;
    }
  });

  const classifyBtn = document.getElementById("classifyBtn");
  if (classifyBtn) classifyBtn.addEventListener("click", async () => {
    const g = grievances.find(x => x.id === currentCaseId);
    document.getElementById("classifyResult").innerHTML = '<div style="margin-top:8px;"><span class="spinner"></span>Redacting PII, then classifying...</div>';
    try {
      const res = await fetch("/api/classify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          id: g.id, description: g.description, locationText: g.locationText,
          citizenName: g.citizenName, citizenContact: g.citizenContact,
        }),
      });
      const out = await res.json();
      if (out.error) throw new Error(out.error);
      applyServerGrievance(g, out);
      render(); currentView = "DETAIL"; currentCaseId = g.id;
    } catch (e) {
      document.getElementById("classifyResult").innerHTML = `<div style="color:var(--brick);margin-top:8px;">${t("couldNotClassify")}</div>`;
    }
  });

  const approveBtn = document.getElementById("approveBtn");
  if (approveBtn) approveBtn.addEventListener("click", async () => {
    const g = grievances.find(x => x.id === currentCaseId);
    if (!hasPermission(session.role, "APPROVE")) return;
    approveBtn.disabled = true;
    try {
      const res = await fetch(`/api/grievances/${g.id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "APPROVE" }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      applyServerGrievance(g, data);
      render();
    } catch (e) {
      approveBtn.disabled = false;
      alert(t("couldNotApprove"));
    }
  });

  const rejectBtn = document.getElementById("rejectBtn");
  if (rejectBtn) rejectBtn.addEventListener("click", async () => {
    const g = grievances.find(x => x.id === currentCaseId);
    if (!hasPermission(session.role, "APPROVE")) return;
    try {
      const res = await fetch(`/api/grievances/${g.id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "REJECT" }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      applyServerGrievance(g, data);
      render();
    } catch (e) {
      alert(t("couldNotSendBack"));
    }
  });

  const assignBtn = document.getElementById("assignBtn");
  if (assignBtn) assignBtn.addEventListener("click", async () => {
    const g = grievances.find(x => x.id === currentCaseId);
    if (!hasPermission(session.role, "ASSIGN")) return;
    const email = document.getElementById("assigneeSelect").value.trim();
    try {
      const res = await fetch(`/api/grievances/${g.id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "ASSIGN", assignedTo: email }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.message || data.error);
      applyServerGrievance(g, data);
      render();
    } catch (e) {
      alert(e.message || t("couldNotAssign"));
    }
  });

  document.querySelectorAll(".statusBtn").forEach(b => b.addEventListener("click", async () => {
    const g = grievances.find(x => x.id === currentCaseId);
    if (!hasPermission(session.role, "EDIT")) return;
    const newStatus = b.dataset.status;
    if (!isValidTransition(g.status, newStatus)) return;
    try {
      const res = await fetch(`/api/grievances/${g.id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "STATUS_CHANGE", newStatus }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      applyServerGrievance(g, data);
      render();
    } catch (e) {
      alert(t("couldNotUpdateStatus"));
    }
  }));

  const verifyBtn = document.getElementById("verifyBtn");
  if (verifyBtn) verifyBtn.addEventListener("click", async () => {
    const g = grievances.find(x => x.id === currentCaseId);
    if (!hasPermission(session.role, "VERIFY") || !isValidTransition(g.status, "VERIFIED")) return;
    try {
      const res = await fetch(`/api/grievances/${g.id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "VERIFY" }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      applyServerGrievance(g, data);
      render();
    } catch (e) {
      alert(t("couldNotVerify"));
    }
  });

  const closeBtn = document.getElementById("closeBtn");
  if (closeBtn) closeBtn.addEventListener("click", async () => {
    const g = grievances.find(x => x.id === currentCaseId);
    if (!hasPermission(session.role, "CLOSE") || !isValidTransition(g.status, "CLOSED")) return;
    try {
      const res = await fetch(`/api/grievances/${g.id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "CLOSE" }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      applyServerGrievance(g, data);
      render();
    } catch (e) {
      alert(t("couldNotClose"));
    }
  });

  const addTaskBtn = document.getElementById("addTaskBtn");
  if (addTaskBtn) addTaskBtn.addEventListener("click", async () => {
    const g = grievances.find(x => x.id === currentCaseId);
    if (!hasPermission(session.role, "EDIT")) return;
    const title = document.getElementById("taskTitle").value;
    const dueDate = document.getElementById("taskDue").value || null;
    if (!title) return;
    try {
      const res = await fetch(`/api/grievances/${g.id}/tasks`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title, dueDate }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      applyServerGrievance(g, data);
      render();
    } catch (e) {
      alert(t("couldNotAddTask"));
    }
  });

  document.querySelectorAll(".taskDoneBtn").forEach(b => b.addEventListener("click", async () => {
    const g = grievances.find(x => x.id === currentCaseId);
    if (!hasPermission(session.role, "EDIT")) return;
    const task = g.tasks[parseInt(b.dataset.idx)];
    try {
      const res = await fetch(`/api/grievances/${g.id}/tasks`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ taskId: task.id, action: "COMPLETE" }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      applyServerGrievance(g, data);
      render();
    } catch (e) {
      alert(t("couldNotMarkTaskDone"));
    }
  }));

  const addEvidenceBtn = document.getElementById("addEvidenceBtn");
  if (addEvidenceBtn) addEvidenceBtn.addEventListener("click", async () => {
    const g = grievances.find(x => x.id === currentCaseId);
    if (!hasPermission(session.role, "EDIT")) return;
    const description = document.getElementById("evidenceDesc").value;
    if (!description) return;
    try {
      const res = await fetch(`/api/grievances/${g.id}/evidence`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ description }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      applyServerGrievance(g, data);
      render();
    } catch (e) {
      alert(t("couldNotAddEvidence"));
    }
  });

  // ---- PROJECTS ----
  const newProjectBtn = document.getElementById("newProjectBtn");
  if (newProjectBtn) newProjectBtn.addEventListener("click", () => { currentView = "PROJECT_NEW"; render(); });
  const backToProjects = document.getElementById("backToProjects");
  if (backToProjects) backToProjects.addEventListener("click", () => { currentView = "PROJECTS"; render(); });
  const saveProjectBtn = document.getElementById("saveProjectBtn");
  if (saveProjectBtn) saveProjectBtn.addEventListener("click", async () => {
    const title = document.getElementById("pTitle").value.trim();
    if (!title) return;
    saveProjectBtn.disabled = true; saveProjectBtn.textContent = t("saving");
    try {
      const res = await fetch("/api/projects", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          title, description: document.getElementById("pDesc").value,
          department: document.getElementById("pDept").value,
          locationText: document.getElementById("pLoc").value,
          sanctionedDate: document.getElementById("pDate").value || null,
        }),
      });
      const out = await res.json();
      if (out.error) throw new Error(out.error);
      await loadProjects();
      currentView = "PROJECTS"; render();
    } catch (e) {
      saveProjectBtn.disabled = false; saveProjectBtn.textContent = t("save");
      alert(t("couldNotSave"));
    }
  });
  document.querySelectorAll(".projectStatusBtn").forEach(b => b.addEventListener("click", async (e) => {
    e.stopPropagation();
    if (!canManageOfficeRecords(session.role)) return;
    try {
      const res = await fetch(`/api/projects/${b.dataset.id}`, {
        method: "PATCH", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "STATUS_CHANGE", status: b.dataset.status }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      await loadProjects(); render();
    } catch (e) { alert(t("couldNotUpdateStatus")); }
  }));
  document.querySelectorAll("[data-open-project]").forEach(el => el.addEventListener("click", async () => {
    currentEntityId = el.dataset.openProject; currentView = "PROJECT_DETAIL"; render();
    try {
      const res = await fetch(`/api/projects/${currentEntityId}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      const idx = projects.findIndex(x => x.id === currentEntityId);
      if (idx >= 0) projects[idx] = data; render();
    } catch (e) { /* keep showing cached list data */ }
  }));
  const savePDetailBtn = document.getElementById("savePDetailBtn");
  if (savePDetailBtn) savePDetailBtn.addEventListener("click", async () => {
    const title = document.getElementById("pdTitle").value.trim();
    if (!title) return;
    try {
      const res = await fetch(`/api/projects/${savePDetailBtn.dataset.id}`, {
        method: "PATCH", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "EDIT", title,
          description: document.getElementById("pdDesc").value,
          department: document.getElementById("pdDept").value,
          locationText: document.getElementById("pdLoc").value,
          sanctionedDate: document.getElementById("pdDate").value || null,
        }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      const idx = projects.findIndex(x => x.id === savePDetailBtn.dataset.id);
      if (idx >= 0) projects[idx] = data;
      render();
    } catch (e) { alert(t("couldNotSave")); }
  });

  // ---- DOCUMENTS ----
  const newDocumentBtn = document.getElementById("newDocumentBtn");
  if (newDocumentBtn) newDocumentBtn.addEventListener("click", () => { currentView = "DOCUMENT_NEW"; render(); });
  const backToDocuments = document.getElementById("backToDocuments");
  if (backToDocuments) backToDocuments.addEventListener("click", () => { currentView = "DOCUMENTS"; render(); });
  const saveDocumentBtn = document.getElementById("saveDocumentBtn");
  if (saveDocumentBtn) saveDocumentBtn.addEventListener("click", async () => {
    const title = document.getElementById("dTitle").value.trim();
    if (!title) return;
    saveDocumentBtn.disabled = true; saveDocumentBtn.textContent = t("saving");
    try {
      const res = await fetch("/api/documents", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          title, sourceDepartment: document.getElementById("dDept").value,
          docType: document.getElementById("dType").value,
          receivedDate: document.getElementById("dDate").value || null,
          summary: document.getElementById("dSummary").value,
        }),
      });
      const out = await res.json();
      if (out.error) throw new Error(out.error);
      await loadDocuments();
      currentView = "DOCUMENTS"; render();
    } catch (e) {
      saveDocumentBtn.disabled = false; saveDocumentBtn.textContent = t("save");
      alert(t("couldNotSave"));
    }
  });
  document.querySelectorAll("[data-open-document]").forEach(el => el.addEventListener("click", async () => {
    currentEntityId = el.dataset.openDocument; currentView = "DOCUMENT_DETAIL"; render();
    try {
      const res = await fetch(`/api/documents/${currentEntityId}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      const idx = documents.findIndex(x => x.id === currentEntityId);
      if (idx >= 0) documents[idx] = data; render();
    } catch (e) { /* keep showing cached list data */ }
  }));
  const saveDDetailBtn = document.getElementById("saveDDetailBtn");
  if (saveDDetailBtn) saveDDetailBtn.addEventListener("click", async () => {
    const title = document.getElementById("ddTitle").value.trim();
    if (!title) return;
    try {
      const res = await fetch(`/api/documents/${saveDDetailBtn.dataset.id}`, {
        method: "PATCH", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "EDIT", title,
          sourceDepartment: document.getElementById("ddDept").value,
          docType: document.getElementById("ddType").value,
          receivedDate: document.getElementById("ddDate").value || null,
          summary: document.getElementById("ddSummary").value,
        }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      const idx = documents.findIndex(x => x.id === saveDDetailBtn.dataset.id);
      if (idx >= 0) documents[idx] = data;
      render();
    } catch (e) { alert(t("couldNotSave")); }
  });

  // ---- COMMITMENTS ----
  const newCommitmentBtn = document.getElementById("newCommitmentBtn");
  if (newCommitmentBtn) newCommitmentBtn.addEventListener("click", () => { currentView = "COMMITMENT_NEW"; render(); });
  const backToCommitments = document.getElementById("backToCommitments");
  if (backToCommitments) backToCommitments.addEventListener("click", () => { currentView = "COMMITMENTS"; render(); });
  const saveCommitmentBtn = document.getElementById("saveCommitmentBtn");
  if (saveCommitmentBtn) saveCommitmentBtn.addEventListener("click", async () => {
    const title = document.getElementById("cTitle").value.trim();
    if (!title) return;
    saveCommitmentBtn.disabled = true; saveCommitmentBtn.textContent = t("saving");
    try {
      const res = await fetch("/api/commitments", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          title, description: document.getElementById("cDesc").value,
          dueDate: document.getElementById("cDue").value || null,
          relatedGrievanceId: document.getElementById("cGrievance").value || null,
        }),
      });
      const out = await res.json();
      if (out.error) throw new Error(out.error);
      await loadCommitments();
      currentView = "COMMITMENTS"; render();
    } catch (e) {
      saveCommitmentBtn.disabled = false; saveCommitmentBtn.textContent = t("save");
      alert(t("couldNotSave"));
    }
  });
  document.querySelectorAll(".commitmentDoneBtn").forEach(b => b.addEventListener("click", async (e) => {
    e.stopPropagation();
    if (!canManageOfficeRecords(session.role)) return;
    try {
      const res = await fetch(`/api/commitments/${b.dataset.id}`, {
        method: "PATCH", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "COMPLETE" }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      await loadCommitments(); render();
    } catch (e) { alert(t("couldNotUpdateStatus")); }
  }));
  document.querySelectorAll("[data-open-commitment]").forEach(el => el.addEventListener("click", async () => {
    currentEntityId = el.dataset.openCommitment; currentView = "COMMITMENT_DETAIL"; render();
    try {
      const res = await fetch(`/api/commitments/${currentEntityId}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      const idx = commitments.findIndex(x => x.id === currentEntityId);
      if (idx >= 0) commitments[idx] = data; render();
    } catch (e) { /* keep showing cached list data */ }
  }));
  const saveCDetailBtn = document.getElementById("saveCDetailBtn");
  if (saveCDetailBtn) saveCDetailBtn.addEventListener("click", async () => {
    const title = document.getElementById("cdTitle").value.trim();
    if (!title) return;
    try {
      const res = await fetch(`/api/commitments/${saveCDetailBtn.dataset.id}`, {
        method: "PATCH", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "EDIT", title,
          description: document.getElementById("cdDesc").value,
          dueDate: document.getElementById("cdDue").value || null,
          relatedGrievanceId: document.getElementById("cdGrievance").value || null,
        }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      const idx = commitments.findIndex(x => x.id === saveCDetailBtn.dataset.id);
      if (idx >= 0) commitments[idx] = data;
      render();
    } catch (e) { alert(t("couldNotSave")); }
  });

  document.getElementById("askBtn").addEventListener("click", async () => {
    const q = document.getElementById("askInput").value.trim();
    if (!q) return;
    const wrap = document.getElementById("askAnswerWrap"), inner = document.getElementById("askAnswerInner");
    wrap.style.display = "flex"; inner.innerHTML = `<div><span class="spinner"></span>${t("thinking")}</div>`;
    try {
      const res = await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        // canSeeSensitive is no longer sent from the browser — the server
        // derives it from the caller's verified role instead.
        body: JSON.stringify({ question: q }),
      });
      const out = await res.json();
      if (out.error) throw new Error(out.error);
      inner.innerHTML = `
        <div class="ans-row answer"><span class="lbl">${escapeHtml(t("answer"))}</span><div class="val"><bdi>${escapeHtml(out.answer)}</bdi></div></div>
        <div class="ans-row"><span class="lbl">${escapeHtml(t("whyItMatters"))}</span><div class="val"><bdi>${escapeHtml(out.why_it_matters || "")}</bdi></div></div>
        <div class="ans-row"><span class="lbl">${escapeHtml(t("evidence"))}</span><div class="val"><bdi>${escapeHtml(out.evidence || "")}</bdi></div></div>
        <div class="ans-row"><span class="lbl">${escapeHtml(t("confidence"))}</span><div class="val"><span class="conf-badge conf-${out.confidence}"><bdi>${escapeHtml(out.confidence || "")}</bdi></span></div></div>
        <div class="ans-row"><span class="lbl">${escapeHtml(t("whatsMissing"))}</span><div class="val"><bdi>${escapeHtml(out.whats_missing || "")}</bdi></div></div>
        <div class="ans-row"><span class="lbl">${escapeHtml(t("recommendedNextStep"))}</span><div class="val"><bdi>${escapeHtml(out.recommended_next_step || "")}</bdi></div></div>
      `;
    } catch (e) { inner.innerHTML = `<div>${t("couldNotReach")}</div>`; }
  });
}

function escapeHtml(str) {
  const d = document.createElement("div");
  d.textContent = str == null ? "" : String(str);
  return d.innerHTML;
}

init();
</script>
</body>
</html>

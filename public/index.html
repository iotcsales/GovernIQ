<style>

    --shadow-card:0 1px 2px rgba(18,25,43,.04), 0 2px 10px rgba(18,25,43,.05);

  }
  *{box-sizing:border-box;}
  html[lang="hi"] body{font-family:'Noto Sans Devanagari','IBM Plex Sans',sans-serif;}
  html[lang="hi"] .serif{font-family:'Noto Serif Devanagari','Fraunces',serif;}
  body{margin:0;background:var(--paper);color:var(--slate-dark);font-family:'IBM Plex Sans','Noto Sans Devanagari',sans-serif;-webkit-font-smoothing:antialiased;}
  .serif{font-family:'Fraunces','Noto Serif Devanagari',serif;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  /* ---- LOGIN ---- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--indigo);padding:20px;}
  .login-box{background:var(--card);border-radius:14px;padding:30px 26px;max-width:360px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .login-box h1{font-family:'Fraunces','Noto Serif Devanagari',serif;font-size:23px;margin:0 0 4px;font-weight:600;}
  .login-box p{font-size:13.5px;color:var(--slate);margin:0 0 18px;line-height:1.5;}
  .login-box label{font-size:11.5px;color:var(--slate);display:block;margin-bottom:4px;}
  .login-box select,.login-box input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;margin-bottom:14px;font-size:14px;}
  .login-box button{width:100%;background:var(--indigo);color:#fff;border:none;padding:11px;border-radius:7px;font-weight:600;font-size:14px;}
  .login-note{font-size:11.5px;color:var(--slate);margin-top:12px;line-height:1.55;padding-top:12px;border-top:1px solid var(--line);}
  .footer-credit{font-size:10.5px;color:var(--slate);text-align:center;margin-top:16px;opacity:.65;letter-spacing:.02em;}

  /* ---- APP SHELL ---- */
  .topbar{background:linear-gradient(155deg,var(--indigo) 0%,var(--indigo-3) 100%);color:#fff;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(199,154,68,.35);}
  .topbar .who{font-size:12.5px;color:#B7BFDA;}
  .topbar .who b{color:#fff;font-weight:600;}
  .topbar .who .role{color:#9BA4C4;}
  .topbar-actions{display:flex;align-items:center;gap:8px;}
  .lang-select{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;padding:6px 9px;border-radius:6px;font-size:12px;appearance:none;-webkit-appearance:none;}
  .lang-select option{color:var(--slate-dark);}
  .topbar button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;padding:6px 11px;border-radius:6px;font-size:12px;}
  .app-body{display:flex;}
  .sidebar{width:64px;flex-shrink:0;background:var(--indigo);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:6px;}
  .sidebar .mark{width:32px;height:32px;border-radius:8px;overflow:hidden;margin-bottom:14px;}
  .sidebar .mark img{width:100%;height:100%;object-fit:cover;display:block;}
  .navicon{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#8E99BC;cursor:pointer;transition:background .15s,color .15s;}
  .navicon svg{width:18px;height:18px;}
  .navicon.active{background:var(--indigo-2);color:var(--brass-2);}
  .navicon:hover{background:var(--indigo-2);color:#fff;}
  .mobile-tabs{display:none;background:var(--indigo-2);overflow-x:auto;}
  .mobile-tab{flex-shrink:0;text-align:center;padding:10px 16px;font-size:12.5px;color:#AEB6D2;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;}

  .page-title{font-family:'Fraunces','Noto Serif Devanagari',serif;font-size:20px;font-weight:600;margin:2px 0 14px;color:var(--ink);}

  .main{flex:1;min-width:0;max-width:900px;padding:18px 24px;padding-bottom:44px;}

  .page-title{font-family:'Fraunces','Noto Serif Devanagari',serif;font-size:23px;font-weight:600;letter-spacing:-.01em;margin:2px 0 16px;}
  .section-title{font-family:'Fraunces','Noto Serif Devanagari',serif;font-size:16px;font-weight:600;margin:22px 0 10px;color:var(--ink);}
  .section-title:first-child{margin-top:0;}

  .strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}

  .stat.amber{border-left-color:var(--amber);}
  .stat.teal{border-left-color:var(--teal);}
  .stat span{font-size:11px;color:var(--slate);line-height:1.3;display:block;}

  .card.st-closed{border-left-color:#7C8A73;}
  .card.st-critical{border-left-color:var(--brick);}

  .pulse-fill{height:100%;background:var(--brass);}

  .pulse-fill.low{background:var(--teal);}
  .pulse-val{font-size:11.5px;color:var(--slate);white-space:nowrap;}

  .changed-item:last-child{border-bottom:none;}
  .changed-dot{width:6px;height:6px;border-radius:50%;margin-top:5px;flex-shrink:0;}
  .changed-dot.new{background:var(--brick);}
  .changed-dot.res{background:var(--teal);}
  .changed-dot.upd{background:var(--brass);}
  .card-title{font-family:'Fraunces','Noto Serif Devanagari',serif;font-size:15.5px;font-weight:500;margin:2px 0 4px;color:var(--ink);}

  .btn.danger{background:var(--brick);border-color:var(--brick);color:#fff;}

  textarea.f{min-height:60px;}
  label.field-row.lbl{font-size:11.5px;color:var(--slate);display:block;margin-bottom:4px;}

  .ai-box{background:var(--paper-2);border-radius:8px;padding:12px;margin-top:10px;}
  .ai-badge{font-size:10px;font-weight:600;background:#E3E7F0;color:var(--indigo-2);padding:2px 7px;border-radius:5px;display:inline-block;margin-bottom:8px;letter-spacing:.02em;}
  .ai-badge.scrutiny{background:var(--amber-tint);color:var(--amber);}
  .ai-row{font-size:12.5px;margin-bottom:5px;}
  .ai-row .lbl{font-size:10.5px;color:var(--slate);}

  .audit-item{font-size:12px;color:var(--slate);padding:7px 0;border-bottom:1px solid var(--line);}
  .audit-item:last-child{border-bottom:none;}
  .audit-item b{color:var(--slate-dark);}
  .task-item,.evid-item{font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;}
  .task-item:last-child,.evid-item:last-child{border-bottom:none;}

  .back-link{font-size:12.5px;color:var(--indigo);cursor:pointer;margin-bottom:12px;display:inline-block;}
  .spinner{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--brass);animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .empty{font-size:13px;color:var(--slate);padding:16px 0;}

  .askbar-wrap{position:fixed;left:64px;right:0;bottom:0;background:linear-gradient(155deg,var(--indigo) 0%,var(--indigo-3) 100%);padding:10px 16px;}
  @media (max-width:860px){ .askbar-wrap{left:0;} }
  .askbar{max-width:688px;margin:0 auto;display:flex;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:5px 5px 5px 12px;}
  .askbar input{flex:1;background:none;border:none;color:#fff;font-size:13.5px;}
  .askbar input::placeholder{color:#9BA4C4;}
  .askbar input:focus{outline:none;}
  .askbar button{background:var(--brass);color:var(--indigo);border:none;font-weight:700;font-size:12.5px;padding:8px 14px;border-radius:7px;}
  .ask-answer{position:fixed;left:64px;right:0;bottom:60px;display:flex;justify-content:center;padding:0 16px;z-index:5;}
  @media (max-width:860px){ .ask-answer{left:0;} }
  .ask-answer-inner{max-width:688px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px 10px 0 0;padding:14px 16px;box-shadow:0 -6px 20px rgba(18,25,43,.12);max-height:38vh;overflow-y:auto;}

  :focus-visible{outline:2px solid var(--brass-2);outline-offset:1px;}
  @media (prefers-reduced-motion:reduce){ .card,.tab,.btn{transition:none;} }
</style>

// MP / MLA / Mayor-Corporator / Sarpanch are NOT different permission
// levels — they're the same role (the elected official who owns the
// office: approves/verifies/closes, deliberately does not do day-to-day
// intake) at different tiers of government. Defined once as
// REPRESENTATIVE_PERMISSIONS and spread into each labeled variant below,
// so the five can never drift out of sync with each other the way five
// independently hand-typed copies eventually would.
const REPRESENTATIVE_PERMISSIONS = { VIEW: true, CREATE: false, EDIT: false, ASSIGN: false, APPROVE: true, VERIFY: true, CLOSE: true, SENSITIVE_DATA_ACCESS: true, scope: "ALL" };

const PERMISSIONS = {
  REPRESENTATIVE_MP:        { ...REPRESENTATIVE_PERMISSIONS },
  REPRESENTATIVE_MLA:       { ...REPRESENTATIVE_PERMISSIONS },
  REPRESENTATIVE_MAYOR:     { ...REPRESENTATIVE_PERMISSIONS },
  REPRESENTATIVE_SARPANCH:  { ...REPRESENTATIVE_PERMISSIONS },
  REPRESENTATIVE_OTHER:     { ...REPRESENTATIVE_PERMISSIONS },
  CHIEF_OF_STAFF:     { VIEW: true, CREATE: true,  EDIT: true,  ASSIGN: true,  APPROVE: true,  VERIFY: true,  CLOSE: true,  SENSITIVE_DATA_ACCESS: true,  scope: "ALL" },
  OFFICE_ADMIN:       { VIEW: true, CREATE: true,  EDIT: true,  ASSIGN: true,  APPROVE: false, VERIFY: false, CLOSE: false, SENSITIVE_DATA_ACCESS: true,  scope: "ALL" },
  CONSTITUENCY_TEAM:  { VIEW: true, CREATE: true,  EDIT: true,  ASSIGN: true,  APPROVE: false, VERIFY: false, CLOSE: false, SENSITIVE_DATA_ACCESS: true,  scope: "ALL" },
  FIELD_TEAM:         { VIEW: true, CREATE: true,  EDIT: true,  ASSIGN: false, APPROVE: false, VERIFY: false, CLOSE: false, SENSITIVE_DATA_ACCESS: true,  scope: "OWN_ASSIGNED" },
  RESEARCH_TEAM:      { VIEW: true, CREATE: false, EDIT: false, ASSIGN: false, APPROVE: false, VERIFY: false, CLOSE: false, SENSITIVE_DATA_ACCESS: false, scope: "ALL" },
};
function hasPermission(role, action) {
  const perms = PERMISSIONS[role];
  if (!perms || !(action in perms)) return false;
  return perms[action] === true;
}
const PHONE_PATTERN = /(?:\+91[-\s]?)?[6-9]\d{9}\b/g;
const EMAIL_PATTERN = /\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b/g;
function redactText(text, citizenName, citizenContact) {
  if (!text) return text;
  let working = text;
  if (citizenName) working = working.split(citizenName).join("[CITIZEN_NAME]");
  if (citizenContact) working = working.split(citizenContact).join("[CITIZEN_CONTACT]");
  working = working.replace(PHONE_PATTERN, "[CITIZEN_CONTACT]");
  working = working.replace(EMAIL_PATTERN, "[CITIZEN_CONTACT]");
  return working;
}
const VALID_TRANSITIONS = {
  DRAFT: ["PENDING_REVIEW"], PENDING_REVIEW: ["NEW", "REVIEW_REQUIRED"], REVIEW_REQUIRED: ["PENDING_REVIEW"],
  NEW: ["ASSIGNED"], ASSIGNED: ["IN_PROGRESS"],
  IN_PROGRESS: ["WAITING_ON_DEPARTMENT", "ESCALATED", "RESOLVED"],
  WAITING_ON_DEPARTMENT: ["IN_PROGRESS", "ESCALATED"], ESCALATED: ["IN_PROGRESS", "RESOLVED"],
  RESOLVED: ["VERIFIED"], VERIFIED: ["CLOSED"], CLOSED: ["REOPENED"], REOPENED: ["IN_PROGRESS"],
};
function isValidTransition(from, to) {
  const allowed = VALID_TRANSITIONS[from];
  return Array.isArray(allowed) && allowed.includes(to);
}

async function callClaude(system, user) {
  const resp = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 500, system, messages: [{ role: "user", content: user }] })
  });
  const data = await resp.json();
  const text = (data.content || []).map(b => b.text || "").join("");
  return JSON.parse(text.replace(/```json|```/g, "").trim());
}

function applyServerGrievance(g, data) {
  // Maps a server response (list row shape, snake_case) onto the local
  // grievance object (camelCase) — used both when opening a case and after
  // every workflow action, so the UI always reflects what's actually in D1.
  g.status = data.status;
  g.category = data.category;
  g.priority = data.priority;
  g.responsibleAuthority = data.responsible_authority;
  g.assignedTo = data.assigned_to;
  g.displayId = data.display_id;
  g.citizenName = data.citizen_name;
  g.citizenContact = data.citizen_contact;
  g.audit = data.audit || g.audit;
  g.tasks = data.tasks || g.tasks || [];
  g.evidence = data.evidence || g.evidence || [];
  if (data.ai_suggestion) {
    const suggestion = typeof data.ai_suggestion === "string" ? JSON.parse(data.ai_suggestion) : data.ai_suggestion;
    const knownAuthorities = ["PHED", "PWD", "Municipal", "Electricity Department", "Health Department"];
    const requiresExtraScrutiny = !knownAuthorities.some(k => (suggestion.authority || "").toLowerCase().includes(k.toLowerCase()));
    g.aiSuggestion = { ...suggestion, priority: (suggestion.severity || "").toUpperCase(), requiresExtraScrutiny };
  }
}

  if (status === "ASSIGNED") return "assigned";

function daysBetween(dateStr) {
  if (!dateStr) return null;
  const target = new Date(dateStr + "T00:00:00");
  const now = new Date(); now.setHours(0, 0, 0, 0);
  return Math.round((target - now) / 86400000);
}
function ageDays(dateTimeStr) {
  if (!dateTimeStr) return null;
  const created = new Date(dateTimeStr.replace(" ", "T") + "Z");
  if (isNaN(created.getTime())) return null;
  return Math.floor((Date.now() - created.getTime()) / 86400000);
}
function dueText(d) {
  if (d < 0) return `${t("overdue")} ${Math.abs(d)} ${t("days")}`;
  if (d === 0) return t("dueToday");
  return `${t("dueIn")} ${d} ${t("days")}`;
}

// Everything below is computed directly from real fields already in D1 —
// priority, status, due_date, sanctioned_date, timestamps. None of this is
// AI-generated text; the one place real AI output exists (classify.js's
// suggestion) keeps its own "AI INFERENCE" badge in the case detail view,
// unchanged. This dashboard never manufactures reasoning that wasn't
// actually computed.
function buildIntelligenceItems() {
  const items = [];

  grievances.forEach(g => {
    if (g.status === "CLOSED" || g.status === "DRAFT") return;
    if (g.status === "PENDING_REVIEW") {
      items.push({ tagLabel: t("tagTodo"), tagClass: "new", title: g.title, meta: g.displayId || t("notYetOfficial"),
        why: t("aiReadyReview"), action: t("actionReviewClassification"), rank: 3 });
      return;
    }
    if (g.priority === "CRITICAL" || g.priority === "HIGH") {
      const age = ageDays(g.createdAt);
      items.push({ tagLabel: t("tagUrgent"), tagClass: "critical", title: g.title, meta: g.displayId,
        why: `${prettyStatus(g.priority)} ${t("priority")}${age != null ? " · " + t("openFor") + " " + age + " " + t("days") : ""}`,
        action: t("actionFollowUpDept"), rank: g.priority === "CRITICAL" ? 1 : 2 });
    }
  });

  projects.forEach(p => {
    if (p.status === "AT_RISK" || p.status === "DELAYED") {
      items.push({ tagLabel: t("tagWatch"), tagClass: "pending", title: p.title, meta: p.department || "",
        why: `${prettyStatus(p.status)}${p.sanctioned_date ? " · " + t("sanctioned") + " " + p.sanctioned_date : ""}`,
        action: t("actionRequestUpdate"), rank: p.status === "AT_RISK" ? 2 : 3 });
    }
  });

  commitments.forEach(c => {
    if (c.status === "DONE") return;
    const d = daysBetween(c.due_date);
    if (d !== null && d <= 3) {
      items.push({ tagLabel: d < 0 ? t("tagUrgent") : t("tagTodo"), tagClass: d < 0 ? "critical" : "new",
        title: c.title, meta: "", why: dueText(d), action: t("actionSendFollowUp"), rank: d < 0 ? 1 : 2 });
    }
  });

  documents.forEach(doc => {
    const age = ageDays(doc.created_at);
    if (age !== null && age <= 7) {
      items.push({ tagLabel: t("tagFollowup"), tagClass: "progress", title: doc.title, meta: doc.source_department || "",
        why: doc.summary || t("recentlyLogged"), action: t("actionReviewDocument"), rank: 4 });
    }
  });

  items.sort((a, b) => a.rank - b.rank);
  return items.slice(0, 6);
}

function renderPulse() {
  const buckets = {};
  grievances.forEach(g => {
    if (!g.category) return;
    if (!buckets[g.category]) buckets[g.category] = 0;
    if (!["CLOSED", "VERIFIED"].includes(g.status)) buckets[g.category]++;
  });
  const cats = Object.keys(buckets);
  if (cats.length === 0) return `<div class="empty">${t("noCategorizedCasesYet")}</div>`;
  const maxOpen = Math.max(...cats.map(c => buckets[c]), 1);
  return cats.map(c => {
    const pct = Math.round((buckets[c] / maxOpen) * 100);
    const fillClass = buckets[c] >= maxOpen ? "high" : buckets[c] === 0 ? "low" : "";
    return `<div class="pulse-item"><span class="pulse-name">${c}</span><div class="pulse-bar"><div class="pulse-fill ${fillClass}" style="width:${pct}%"></div></div><span class="pulse-val">${buckets[c]} ${t("open")}</span></div>`;
  }).join("");
}

function activityDotClass(action) {
  if (["CREATED", "LOGGED"].includes(action)) return "new";
  if (["CLOSED", "COMPLETED", "VERIFIED"].includes(action)) return "res";

}

  if (activity.length === 0) return `<div class="empty">${t("noRecentActivity")}</div>`;

function renderCommitmentsDueSoon() {
  const upcoming = commitments.filter(c => c.status !== "DONE" && c.due_date)
    .sort((a, b) => a.due_date.localeCompare(b.due_date)).slice(0, 5);
  if (upcoming.length === 0) return `<div class="empty">${t("noCommitmentsDueSoon")}</div>`;
  return upcoming.map(c => {
    const d = daysBetween(c.due_date);
    return `<div class="changed-item"><span class="changed-dot ${d < 0 ? "new" : "upd"}"></span>${c.title} — ${dueText(d)}</div>`;
  }).join("");
}

    <div class="askbar-wrap"><div class="askbar">
      <input id="askInput" type="text" placeholder="${t("askPlaceholder")}" />
      <button id="askBtn">${t("ask")}</button>
    </div></div>`;
}

// =====================================================================
// HANDLERS
// =====================================================================
function attachAppHandlers() {
  document.getElementById("logoutBtn").addEventListener("click", () => {
    // Real sign-out now happens at Cloudflare Access, not in this page's
    // memory — clearing local `session` alone would leave the Access
    // cookie valid and just reload back into the same identity.
    window.location.href = `https://${ACCESS_TEAM_DOMAIN}/cdn-cgi/access/logout`;
  });
  const langSelect = document.getElementById("langSelect");
  if (langSelect) langSelect.addEventListener("change", (e) => {
    currentLang = e.target.value;
    if (typeof localStorage !== "undefined") localStorage.setItem("governiq_lang", currentLang);
    document.documentElement.lang = currentLang;
    render();
  });
  document.querySelectorAll("[data-nav]").forEach(navEl => navEl.addEventListener("click", () => { currentView = navEl.dataset.nav; render(); }));
  document.querySelectorAll("[data-open]").forEach(c => c.addEventListener("click", async () => {
    currentCaseId = c.dataset.open; currentView = "DETAIL"; render();
    // Fetch the real, current state (including the actual audit trail) from
    // D1 rather than trusting whatever this browser tab happened to have in
    // memory — another user or session may have changed this case since.
    try {
      const res = await fetch(`/api/grievances/${currentCaseId}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      const g = grievances.find(x => x.id === currentCaseId);
      if (g) { applyServerGrievance(g, data); render(); }
    } catch (e) {
      // Keep showing whatever was cached locally; detail view still usable.
    }
  }));

  const backLink = document.getElementById("backToList");
  if (backLink) backLink.addEventListener("click", () => { currentView = "LIST"; render(); });

  const newBtn = document.getElementById("newCaseBtn");
  if (newBtn) newBtn.addEventListener("click", () => { currentView = "NEW"; render(); });

  const saveDraftBtn = document.getElementById("saveDraftBtn");
  if (saveDraftBtn) saveDraftBtn.addEventListener("click", async () => {
    const payload = {
      title: document.getElementById("fTitle").value,
      description: document.getElementById("fDesc").value,
      locationText: document.getElementById("fLoc").value,
      citizenName: document.getElementById("fName").value,
      citizenContact: document.getElementById("fContact").value,
      // createdBy is no longer sent — the server derives it from the
      // verified Access session instead of trusting a client-supplied value.
    };
    const saveBtnEl = document.getElementById("saveDraftBtn");
    saveBtnEl.disabled = true;
    saveBtnEl.textContent = t("saving");
    try {
      const res = await fetch("/api/grievances", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const created = await res.json();
      const g = {
        id: created.id, displayId: null, status: created.status,
        title: payload.title, description: payload.description, locationText: payload.locationText,
        citizenName: payload.citizenName, citizenContact: payload.citizenContact,
        category: null, priority: null, responsibleAuthority: null,
        aiSuggestion: null, assignedTo: null, tasks: [], evidence: [],
        audit: [],
      };
      addAudit(g, "CREATED", "Draft saved by field intake — persisted to database");
      grievances.unshift(g);
      currentCaseId = g.id; currentView = "DETAIL"; render();
    } catch (e) {
      saveBtnEl.disabled = false;
      saveBtnEl.textContent = t("saveDraft");
      alert(t("couldNotSave"));
    }
  });

  const classifyBtn = document.getElementById("classifyBtn");
  if (classifyBtn) classifyBtn.addEventListener("click", async () => {
    const g = grievances.find(x => x.id === currentCaseId);
    document.getElementById("classifyResult").innerHTML = '<div style="margin-top:8px;"><span class="spinner"></span>Redacting PII, then classifying...</div>';
    try {
      const res = await fetch("/api/classify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          id: g.id, title: g.title, description: g.description, locationText: g.locationText,
          citizenName: g.citizenName, citizenContact: g.citizenContact,
        }),
      });
      const out = await res.json();
      if (out.error) throw new Error(out.error);
      applyServerGrievance(g, out);
      render(); currentView = "DETAIL"; currentCaseId = g.id;
    } catch (e) {
      document.getElementById("classifyResult").innerHTML = `<div style="color:var(--brick);margin-top:8px;">${t("couldNotClassify")}</div>`;
    }
  });

  const approveBtn = document.getElementById("approveBtn");
  if (approveBtn) approveBtn.addEventListener("click", async () => {
    const g = grievances.find(x => x.id === currentCaseId);
    if (!hasPermission(session.role, "APPROVE")) return;
    approveBtn.disabled = true;
    try {
      const res = await fetch(`/api/grievances/${g.id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "APPROVE" }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      applyServerGrievance(g, data);
      render();
    } catch (e) {
      approveBtn.disabled = false;
      alert(t("couldNotApprove"));
    }
  });

  const rejectBtn = document.getElementById("rejectBtn");
  if (rejectBtn) rejectBtn.addEventListener("click", async () => {
    const g = grievances.find(x => x.id === currentCaseId);
    if (!hasPermission(session.role, "APPROVE")) return;
    try {
      const res = await fetch(`/api/grievances/${g.id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "REJECT" }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      applyServerGrievance(g, data);
      render();
    } catch (e) {
      alert(t("couldNotSendBack"));
    }
  });

  const assignBtn = document.getElementById("assignBtn");
  if (assignBtn) assignBtn.addEventListener("click", async () => {
    const g = grievances.find(x => x.id === currentCaseId);
    if (!hasPermission(session.role, "ASSIGN")) return;
    const email = document.getElementById("assigneeInput").value.trim();
    try {
      const res = await fetch(`/api/grievances/${g.id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "ASSIGN", assignedTo: email }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.message || data.error);
      applyServerGrievance(g, data);
      render();
    } catch (e) {
      alert(e.message || t("couldNotAssign"));
    }
  });

  document.querySelectorAll(".statusBtn").forEach(b => b.addEventListener("click", async () => {
    const g = grievances.find(x => x.id === currentCaseId);
    if (!hasPermission(session.role, "EDIT")) return;
    const newStatus = b.dataset.status;
    if (!isValidTransition(g.status, newStatus)) return;
    try {
      const res = await fetch(`/api/grievances/${g.id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "STATUS_CHANGE", newStatus }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      applyServerGrievance(g, data);
      render();
    } catch (e) {
      alert(t("couldNotUpdateStatus"));
    }
  }));

  const verifyBtn = document.getElementById("verifyBtn");
  if (verifyBtn) verifyBtn.addEventListener("click", async () => {
    const g = grievances.find(x => x.id === currentCaseId);
    if (!hasPermission(session.role, "VERIFY") || !isValidTransition(g.status, "VERIFIED")) return;
    try {
      const res = await fetch(`/api/grievances/${g.id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "VERIFY" }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      applyServerGrievance(g, data);
      render();
    } catch (e) {
      alert(t("couldNotVerify"));
    }
  });

  const closeBtn = document.getElementById("closeBtn");
  if (closeBtn) closeBtn.addEventListener("click", async () => {
    const g = grievances.find(x => x.id === currentCaseId);
    if (!hasPermission(session.role, "CLOSE") || !isValidTransition(g.status, "CLOSED")) return;
    try {
      const res = await fetch(`/api/grievances/${g.id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "CLOSE" }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      applyServerGrievance(g, data);
      render();
    } catch (e) {
      alert(t("couldNotClose"));
    }
  });

  const addTaskBtn = document.getElementById("addTaskBtn");
  if (addTaskBtn) addTaskBtn.addEventListener("click", async () => {
    const g = grievances.find(x => x.id === currentCaseId);
    if (!hasPermission(session.role, "EDIT")) return;
    const title = document.getElementById("taskTitle").value;
    const dueDate = document.getElementById("taskDue").value || null;
    if (!title) return;
    try {
      const res = await fetch(`/api/grievances/${g.id}/tasks`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title, dueDate }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      applyServerGrievance(g, data);
      render();
    } catch (e) {
      alert(t("couldNotAddTask"));
    }
  });

  document.querySelectorAll(".taskDoneBtn").forEach(b => b.addEventListener("click", async () => {
    const g = grievances.find(x => x.id === currentCaseId);
    if (!hasPermission(session.role, "EDIT")) return;
    const task = g.tasks[parseInt(b.dataset.idx)];
    try {
      const res = await fetch(`/api/grievances/${g.id}/tasks`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ taskId: task.id, action: "COMPLETE" }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      applyServerGrievance(g, data);
      render();
    } catch (e) {
      alert(t("couldNotMarkTaskDone"));
    }
  }));

  const addEvidenceBtn = document.getElementById("addEvidenceBtn");
  if (addEvidenceBtn) addEvidenceBtn.addEventListener("click", async () => {
    const g = grievances.find(x => x.id === currentCaseId);
    if (!hasPermission(session.role, "EDIT")) return;
    const description = document.getElementById("evidenceDesc").value;
    if (!description) return;
    try {
      const res = await fetch(`/api/grievances/${g.id}/evidence`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ description }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      applyServerGrievance(g, data);
      render();
    } catch (e) {
      alert(t("couldNotAddEvidence"));
    }
  });

  // ---- PROJECTS ----
  const newProjectBtn = document.getElementById("newProjectBtn");
  if (newProjectBtn) newProjectBtn.addEventListener("click", () => { currentView = "PROJECT_NEW"; render(); });
  const backToProjects = document.getElementById("backToProjects");
  if (backToProjects) backToProjects.addEventListener("click", () => { currentView = "PROJECTS"; render(); });
  const saveProjectBtn = document.getElementById("saveProjectBtn");
  if (saveProjectBtn) saveProjectBtn.addEventListener("click", async () => {
    const title = document.getElementById("pTitle").value.trim();
    if (!title) return;
    saveProjectBtn.disabled = true; saveProjectBtn.textContent = t("saving");
    try {
      const res = await fetch("/api/projects", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          title, description: document.getElementById("pDesc").value,
          department: document.getElementById("pDept").value,
          locationText: document.getElementById("pLoc").value,
          sanctionedDate: document.getElementById("pDate").value || null,
        }),
      });
      const out = await res.json();
      if (out.error) throw new Error(out.error);
      await loadProjects();
      currentView = "PROJECTS"; render();
    } catch (e) {
      saveProjectBtn.disabled = false; saveProjectBtn.textContent = t("save");
      alert(t("couldNotSave"));
    }
  });
  document.querySelectorAll(".projectStatusBtn").forEach(b => b.addEventListener("click", async () => {
    if (!canManageOfficeRecords(session.role)) return;
    try {
      const res = await fetch(`/api/projects/${b.dataset.id}`, {
        method: "PATCH", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status: b.dataset.status }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      await loadProjects(); render();
    } catch (e) { alert(t("couldNotUpdateStatus")); }
  }));

  // ---- DOCUMENTS ----
  const newDocumentBtn = document.getElementById("newDocumentBtn");
  if (newDocumentBtn) newDocumentBtn.addEventListener("click", () => { currentView = "DOCUMENT_NEW"; render(); });
  const backToDocuments = document.getElementById("backToDocuments");
  if (backToDocuments) backToDocuments.addEventListener("click", () => { currentView = "DOCUMENTS"; render(); });
  const saveDocumentBtn = document.getElementById("saveDocumentBtn");
  if (saveDocumentBtn) saveDocumentBtn.addEventListener("click", async () => {
    const title = document.getElementById("dTitle").value.trim();
    if (!title) return;
    saveDocumentBtn.disabled = true; saveDocumentBtn.textContent = t("saving");
    try {
      const res = await fetch("/api/documents", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          title, sourceDepartment: document.getElementById("dDept").value,
          docType: document.getElementById("dType").value,
          receivedDate: document.getElementById("dDate").value || null,
          summary: document.getElementById("dSummary").value,
        }),
      });
      const out = await res.json();
      if (out.error) throw new Error(out.error);
      await loadDocuments();
      currentView = "DOCUMENTS"; render();
    } catch (e) {
      saveDocumentBtn.disabled = false; saveDocumentBtn.textContent = t("save");
      alert(t("couldNotSave"));
    }
  });

  // ---- COMMITMENTS ----
  const newCommitmentBtn = document.getElementById("newCommitmentBtn");
  if (newCommitmentBtn) newCommitmentBtn.addEventListener("click", () => { currentView = "COMMITMENT_NEW"; render(); });
  const backToCommitments = document.getElementById("backToCommitments");
  if (backToCommitments) backToCommitments.addEventListener("click", () => { currentView = "COMMITMENTS"; render(); });
  const saveCommitmentBtn = document.getElementById("saveCommitmentBtn");
  if (saveCommitmentBtn) saveCommitmentBtn.addEventListener("click", async () => {
    const title = document.getElementById("cTitle").value.trim();
    if (!title) return;
    saveCommitmentBtn.disabled = true; saveCommitmentBtn.textContent = t("saving");
    try {
      const res = await fetch("/api/commitments", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          title, description: document.getElementById("cDesc").value,
          dueDate: document.getElementById("cDue").value || null,
        }),
      });
      const out = await res.json();
      if (out.error) throw new Error(out.error);
      await loadCommitments();
      currentView = "COMMITMENTS"; render();
    } catch (e) {
      saveCommitmentBtn.disabled = false; saveCommitmentBtn.textContent = t("save");
      alert(t("couldNotSave"));
    }
  });
  document.querySelectorAll(".commitmentDoneBtn").forEach(b => b.addEventListener("click", async () => {
    if (!canManageOfficeRecords(session.role)) return;
    try {
      const res = await fetch(`/api/commitments/${b.dataset.id}`, {
        method: "PATCH", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "COMPLETE" }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      await loadCommitments(); render();
    } catch (e) { alert(t("couldNotUpdateStatus")); }
  }));

  document.getElementById("askBtn").addEventListener("click", async () => {
    const q = document.getElementById("askInput").value.trim();
    if (!q) return;
    const wrap = document.getElementById("askAnswerWrap"), inner = document.getElementById("askAnswerInner");
    wrap.style.display = "flex"; inner.innerHTML = `<div><span class="spinner"></span>${t("thinking")}</div>`;
    try {
      const res = await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        // canSeeSensitive is no longer sent from the browser — the server
        // derives it from the caller's verified role instead.
        body: JSON.stringify({ question: q }),
      });
      const out = await res.json();
      if (out.error) throw new Error(out.error);
      inner.innerHTML = `<div style="font-size:13px;"><b>${t("answer")}:</b> ${out.answer}</div><div style="font-size:12px;color:var(--slate);margin-top:4px;">${t("confidence")}: ${out.confidence}</div>`;
    } catch (e) { inner.innerHTML = `<div>${t("couldNotReach")}</div>`; }
  });
}

init();
</script>
